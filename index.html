<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTrack · 자료 보관</title>
  <style>
    :root { color-scheme:light; --ink:#1c2a40; --muted:#8290a4; --line:#dfe5ee; --blue:#3567df; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:40px 20px; background:#f3f5f9; color:var(--ink); font:14px/1.65 "Segoe UI","Malgun Gothic",Arial,sans-serif; }
    main { width:100%; min-width:0; max-width:640px; background:white; border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 42px #263b5810; }
    header { padding:25px 30px 0; border-bottom:1px solid var(--line); }
    .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .view-tabs { display:flex; gap:24px; }
    .view-tabs button { padding:10px 0; border-radius:0; border-bottom:3px solid transparent; background:transparent; color:var(--muted); }
    .view-tabs button:hover { background:#edf2fd; color:var(--blue); }
    .view-tabs button[aria-selected="true"] { border-bottom-color:var(--blue); color:var(--blue); }
    h1 { font-size:25px; letter-spacing:-.8px; margin:0; }
    h1 span { color:var(--blue); }
    .local { color:var(--muted); font-size:10px; font-weight:650; letter-spacing:1.8px; }
    form { padding:27px 30px 30px; }
    label { display:block; margin-bottom:22px; }
    label span { display:block; margin-bottom:8px; font-size:12px; font-weight:650; }
    input,select,textarea,button { font:inherit; }
    input,select,textarea { width:100%; padding:11px 13px; color:var(--ink); border:1px solid var(--line); border-radius:7px; background:white; font-size:13px; }
    textarea { min-height:280px; resize:vertical; line-height:1.75; font-family:"Consolas","Malgun Gothic",monospace; }
    input::placeholder,textarea::placeholder { color:#a2acba; }
    input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible { outline:3px solid #b2c7fb; outline-offset:2px; }
    .actions { display:flex; justify-content:space-between; align-items:center; gap:14px; }
    button { cursor:pointer; border:0; border-radius:7px; background:var(--blue); color:white; font-size:13px; font-weight:650; padding:11px 23px; }
    button:hover { background:#2455c6; }
    button:disabled { opacity:.55; cursor:wait; }
    .secondary { background:#edf2fd; color:var(--blue); }
    .secondary:hover { background:#dfe9fc; }
    .save-buttons { display:flex; gap:8px; margin-left:auto; }
    #saved-panel { padding:24px 30px; }
    .drafts-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    #saved-status { color:var(--muted); font-size:12px; }
    .drafts-table-wrap { overflow-x:auto; }
    .drafts-table { width:100%; min-width:480px; table-layout:fixed; border-collapse:collapse; font-size:12px; }
    .drafts-table th,.drafts-table td { padding:12px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; overflow-wrap:anywhere; }
    .drafts-table th { color:var(--muted); font-size:11px; font-weight:650; }
    .drafts-table th:first-child { width:95px; }
    .drafts-table th:nth-child(2) { width:105px; }
    .drafts-table th:last-child { width:52px; }
    .drafts-table button { padding:5px 0; background:transparent; color:var(--blue); font-size:12px; }
    .draft-preview { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:4px; color:var(--muted); font-size:11px; white-space:pre-wrap; }
    .category-picker { min-width:0; margin:0 0 22px; padding:0; border:0; }
    .category-picker legend { padding:0; margin-bottom:8px; font-size:12px; font-weight:650; }
    .category-tabs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; padding:4px; margin-bottom:12px; border-radius:9px; background:#f3f5f9; }
    .category-tabs button { min-height:40px; padding:8px 5px; background:transparent; color:var(--ink); font-size:12px; }
    .category-tabs button:hover { background:#e7edf7; }
    .category-tabs button[aria-selected="true"] { background:white; color:var(--blue); box-shadow:0 1px 4px #263b5818; }
    .category-chips { display:flex; flex-wrap:wrap; gap:8px; }
    .category-chip { position:relative; margin:0; cursor:pointer; }
    .category-chip input { position:absolute; width:100%; height:100%; margin:0; padding:0; opacity:0; cursor:pointer; }
    .category-chip span { margin:0; padding:7px 12px; border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:500; }
    .category-chip:hover span { border-color:var(--blue); }
    .category-chip input:checked + span { border-color:var(--blue); background:#edf2fd; color:var(--blue); font-weight:650; }
    .category-chip input:focus-visible + span { outline:3px solid #b2c7fb; outline-offset:2px; }
    #status { color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
    #status.error,#saved-status.error { color:#b23e4e; }
    footer { padding:0 30px 22px; color:var(--muted); font-size:11px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
    #change-file { background:transparent; color:var(--muted); padding:0; font-size:11px; font-weight:400; }
    .hint { color:var(--muted); font-size:11px; font-weight:400; }
    .attachments { margin:-6px 0 24px; }
    #attach { background:#edf2fd; color:var(--blue); padding:8px 14px; }
    #images { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    .image-card { width:130px; border:1px solid var(--line); border-radius:7px; padding:7px; }
    .image-card img { width:100%; height:80px; object-fit:contain; display:block; }
    .image-card span { display:block; font-size:11px; overflow-wrap:anywhere; margin:5px 0; }
    .image-card button { background:transparent; color:var(--muted); padding:0; font-size:11px; }
    .ai-request { border-top:1px solid var(--line); padding:24px 30px 28px; }
    .ai-request h2 { margin:0 0 6px; font-size:16px; }
    .ai-request p { margin:0 0 14px; color:var(--muted); font-size:12px; }
    #ai-prompt { min-height:150px; background:#f8faff; font-family:inherit; }
    .ai-request .actions { margin-top:12px; }
    #copy-status { color:var(--muted); font-size:11px; }
    [hidden] { display:none !important; }
    @media(max-width:500px) { body { padding:18px 12px; } header { padding:20px 20px 0; } form { padding:22px 20px; } footer { padding:0 20px 20px; } .ai-request,#saved-panel { padding:22px 20px; } textarea { min-height:240px; } .actions { align-items:start; flex-wrap:wrap; } .actions #status { flex-basis:100%; } .save-buttons button { padding:10px 14px; } .category-tabs { grid-template-columns:repeat(2,minmax(0,1fr)); } .category-tabs button { padding:8px 3px; font-size:11px; word-break:keep-all; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="header-row"><h1>Dev<span>Track</span></h1><span class="local">LOCAL NOTES</span></div>
      <div id="view-tabs" class="view-tabs" role="tablist" aria-label="자료 화면">
        <button id="input-tab" type="button" role="tab" aria-selected="true" aria-controls="input-panel" data-view="input">자료 입력</button>
        <button id="saved-tab" type="button" role="tab" aria-selected="false" aria-controls="saved-panel" data-view="saved" tabindex="-1">저장된 자료</button>
      </div>
    </header>
    <section id="input-panel" role="tabpanel" aria-labelledby="input-tab">
    <form id="draft-form">
      <fieldset class="category-picker">
        <legend>카테고리</legend>
        <select id="category" hidden>
        <optgroup label="개발 · 설계">
          <option value="backend">백엔드</option>
          <option value="programming-languages">프로그래밍 언어</option>
          <option value="database">데이터베이스</option>
          <option value="database/redis">Redis</option>
          <option value="database/kafka">Kafka</option>
          <option value="networking">네트워크</option>
          <option value="security">보안</option>
          <option value="system-design">시스템 디자인</option>
          <option value="software">소프트웨어</option>
          <option value="interview">인터뷰 질문</option>
        </optgroup>
        <optgroup label="인프라 · 운영 · 도구">
          <option value="infrastructure">인프라 (일반)</option>
          <option value="infrastructure/cloud">클라우드</option>
          <option value="infrastructure/kubernetes">Kubernetes</option>
          <option value="infrastructure/docker">Docker</option>
          <option value="infrastructure/linux">리눅스</option>
          <option value="devops">데브옵스</option>
          <option value="devops/ci-cd">CI/CD</option>
          <option value="data-engineering">데이터 엔지니어링</option>
          <option value="open-source">오픈소스</option>
        </optgroup>
        <optgroup label="AI">
          <option value="ai">AI</option>
          <option value="ai/agents">AI 에이전트</option>
          <option value="ai/rag">RAG</option>
          <option value="ai/vibe-coding">바이브코딩</option>
          <option value="ai/claude">Claude</option>
          <option value="ai/codex">Codex</option>
          <option value="ai/jev">Jev</option>
          <option value="ai/rea">REA</option>
        </optgroup>
        <optgroup label="프론트엔드 · 디자인">
          <option value="frontend">프론트엔드</option>
          <option value="design">디자인</option>
        </optgroup>
        </select>
        <div id="category-tabs" class="category-tabs" role="tablist" aria-label="카테고리 대분류"></div>
        <div id="category-panels"></div>
      </fieldset>
      <label><span>제목 <small class="hint">선택 사항</small></span><input id="title" type="text" autocomplete="off" placeholder="비워 두면 Codex가 정리할 때 본문에서 제목을 붙입니다."></label>
      <label><span>내용</span><textarea id="content" spellcheck="false" aria-describedby="image-hint" placeholder="텍스트, 코드, URL을 그대로 붙여넣으세요. 캡처하거나 복사한 이미지도 Ctrl+V로 첨부할 수 있습니다."></textarea></label>
      <div class="attachments">
        <button id="attach" type="button">이미지 첨부</button>
        <input id="image-input" type="file" accept="image/*" multiple hidden>
        <span id="image-hint" class="hint">파일 선택 또는 내용 입력란에서 Ctrl+V · 여러 장 첨부 가능 · 원본 그대로 보관</span>
        <div id="images" aria-label="첨부할 이미지"></div>
      </div>
      <div class="actions"><span id="status" role="status" aria-live="polite">첫 저장에서 index.html이 있는 DevTrack 폴더를 한 번 선택하세요.</span><div class="save-buttons"><button id="cancel-edit" class="secondary" type="button" hidden>수정 취소</button><button id="save" type="submit">자료 저장</button></div></div>
    </form>
    <section class="ai-request" aria-labelledby="ai-request-heading">
      <h2 id="ai-request-heading">AI에게 정리 요청</h2>
      <p>자료를 저장한 뒤 아래 문구를 복사해 Codex에 붙여넣으세요.</p>
      <textarea id="ai-prompt" readonly spellcheck="false" aria-label="AI에게 보낼 정리 요청">drafts.json을 읽고 각 항목을 기술 노트 형태로 정리해 category에 해당하는 디렉터리의 notes.md에 &lt;details&gt; Toggle로 추가해. 원본의 기술적 의미, 코드, URL은 유지하고 원문에 없는 내용을 추가하지 마. 모두 정상 반영됐는지 확인한 후 drafts.json의 내용을 삭제한 다음에 git에 commit 및 push 진행해.</textarea>
      <div class="actions"><span id="copy-status" role="status" aria-live="polite">저장한 자료 전체를 정리하는 요청입니다.</span><button id="copy-prompt" type="button">요청 문구 복사</button></div>
    </section>
    </section>
    <section id="saved-panel" role="tabpanel" aria-labelledby="saved-tab" hidden>
      <div class="drafts-toolbar"><span id="saved-status" role="status" aria-live="polite">저장된 자료를 불러옵니다.</span><button id="refresh-drafts" class="secondary" type="button">새로고침</button></div>
      <div class="drafts-table-wrap" role="region" aria-label="저장된 자료 표" tabindex="0">
        <table class="drafts-table">
          <thead><tr><th scope="col">저장 시각</th><th scope="col">카테고리</th><th scope="col">제목 / 내용</th><th scope="col">관리</th></tr></thead>
          <tbody id="saved-drafts"></tbody>
        </table>
      </div>
    </section>
    <footer><span>선택한 폴더의 drafts.json에 계속 누적됩니다.</span><button id="change-file" type="button" hidden>저장 폴더 변경</button></footer>
  </main>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const categories = new Map([...$('category').options].map(option => [option.value,option.textContent]));
    const categoryTabs = [], categoryPanels = [];
    function showCategory(index) {
      categoryTabs.forEach((tab,i)=>{
        tab.setAttribute('aria-selected',i===index);
        tab.tabIndex=i===index?0:-1;
        categoryPanels[i].hidden=i!==index;
      });
      $('category').value=categoryPanels[index].querySelector('input:checked').value;
    }
    [...$('category').children].forEach((group,index)=>{
      const tab=document.createElement('button');tab.type='button';tab.role='tab';tab.id=`category-tab-${index}`;tab.textContent=group.label;
      const panel=document.createElement('div');panel.id=`category-panel-${index}`;panel.role='tabpanel';panel.className='category-chips';
      tab.setAttribute('aria-controls',panel.id);panel.setAttribute('aria-labelledby',tab.id);
      [...group.children].forEach((option,i)=>{
        const label=document.createElement('label');label.className='category-chip';
        const input=document.createElement('input');input.type='radio';input.name=`category-choice-${index}`;input.value=option.value;input.checked=option.selected||i===0;
        const text=document.createElement('span');text.textContent=option.textContent;
        input.onchange=()=>{$('category').value=input.value;};
        label.append(input,text);panel.append(label);
      });
      tab.onclick=()=>showCategory(index);
      categoryTabs.push(tab);categoryPanels.push(panel);
      $('category-tabs').append(tab);$('category-panels').append(panel);
    });
    showCategory([...$('category').children].findIndex(group=>[...group.children].some(option=>option.selected)));
    for(const list of document.querySelectorAll('[role="tablist"]'))list.onkeydown=event=>{
      const tabs=[...list.children], index=tabs.indexOf(document.activeElement), count=tabs.length;
      const next={ArrowRight:(index+1)%count,ArrowLeft:(index+count-1)%count,Home:0,End:count-1}[event.key];
      if(next===undefined)return;
      event.preventDefault();tabs[next].click();tabs[next].focus();
    };
    let fileHandle = null, rootHandle = null, saving = false, loadingDrafts = false, editingDraft = null;
    const attachments = [];
    const message = (text,error=false,id='status') => { $(id).textContent=text; $(id).classList.toggle('error',error); };
    function showView(view) {
      for(const tab of $('view-tabs').children){
        const active=tab.dataset.view===view;
        tab.setAttribute('aria-selected',active);tab.tabIndex=active?0:-1;
        $(tab.getAttribute('aria-controls')).hidden=!active;
      }
      if(view==='saved')loadSavedDrafts();
    }
    for(const tab of $('view-tabs').children)tab.onclick=()=>showView(tab.dataset.view);
    function resetEditor() {
      editingDraft=null;$('title').value='';$('content').value='';
      for(const item of attachments)URL.revokeObjectURL(item.preview);
      attachments.length=0;renderImages();
      $('save').textContent='자료 저장';$('cancel-edit').hidden=true;$('change-file').disabled=saving||loadingDrafts;
    }
    function editDraft(entry) {
      if(saving)return;
      showView('input');
      if(editingDraft?.id===entry.id){$('title').focus();return;}
      if(editingDraft || $('title').value || $('content').value || attachments.length){message('입력 중인 자료를 먼저 저장하거나 비워 주세요.',true);return;}
      editingDraft=entry;$('title').value=entry.title;$('content').value=entry.content;
      const input=[...$('category-panels').querySelectorAll('input')].find(input=>input.value===entry.category);
      input.checked=true;showCategory(categoryPanels.indexOf(input.closest('[role="tabpanel"]')));
      $('save').textContent='수정 저장';$('cancel-edit').hidden=false;$('change-file').disabled=true;
      message('저장된 자료를 수정하고 있습니다.');$('title').focus();
    }
    async function loadSavedDrafts() {
      if(loadingDrafts)return;
      if(saving){message('자료를 저장하고 있습니다.',false,'saved-status');return;}
      loadingDrafts=true;$('refresh-drafts').disabled=true;$('change-file').disabled=true;
      $('saved-drafts').replaceChildren();message('불러오는 중…',false,'saved-status');
      try{
        if(!rootHandle)await chooseRoot();
        if(await rootHandle.queryPermission({mode:'readwrite'})!=='granted' && await rootHandle.requestPermission({mode:'readwrite'})!=='granted')throw new Error('자료를 읽으려면 폴더 접근을 허용해 주세요.');
        let text='';
        try{fileHandle=await rootHandle.getFileHandle('drafts.json');text=await (await fileHandle.getFile()).text();}
        catch(error){if(error.name!=='NotFoundError')throw error;fileHandle=null;}
        const drafts=parseDrafts(text);
        for(const entry of drafts.slice().reverse()){
          const row=document.createElement('tr');row.dataset.id=entry.id;
          const date=document.createElement('td');date.textContent=new Date(entry.createdAt).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
          const category=document.createElement('td');category.textContent=categories.get(entry.category);
          const copy=document.createElement('td');
          const title=document.createElement('strong');title.textContent=entry.title.trim()?entry.title:'제목 없음';
          const preview=document.createElement('div');preview.className='draft-preview';preview.textContent=entry.content.slice(0,160);
          copy.append(title,preview);
          const actions=document.createElement('td'), edit=document.createElement('button');edit.type='button';edit.textContent='수정';edit.setAttribute('aria-label',title.textContent+' 수정');edit.onclick=()=>editDraft(entry);actions.append(edit);
          row.append(date,category,copy,actions);$('saved-drafts').append(row);
        }
        message(drafts.length?`총 ${drafts.length}개 · 최근 저장 순`:'저장된 자료가 없습니다.',false,'saved-status');
      }catch(error){message(error.name==='AbortError'?'폴더 선택을 취소했습니다.':error.message,true,'saved-status');}
      finally{loadingDrafts=false;$('refresh-drafts').disabled=false;$('change-file').disabled=saving||!!editingDraft;}
    }
    $('refresh-drafts').onclick=loadSavedDrafts;
    $('cancel-edit').onclick=()=>{if(saving)return;resetEditor();showView('saved');};
    function cacheHandle(action, handle, key='drafts') {
      return new Promise((resolve,reject) => {
        const request=indexedDB.open('devtrack-drafts',1);
        request.onupgradeneeded=()=>request.result.createObjectStore('files');
        request.onerror=()=>reject(request.error);
        request.onsuccess=()=>{
          const db=request.result;const transaction=db.transaction('files',action==='get'?'readonly':'readwrite');let value;
          try {
            const store=transaction.objectStore('files');
            const operation=action==='get'?store.get(key):store.put(handle,key);
            operation.onsuccess=()=>{value=operation.result;};
          } catch(error) { db.close();reject(error);return; }
          transaction.oncomplete=()=>{db.close();resolve(value);};
          transaction.onerror=()=>{db.close();reject(transaction.error);};
        };
      });
    }
    async function chooseRoot(change=false) {
      if(typeof window.showDirectoryPicker!=='function')throw new Error('Chrome 또는 Edge에서 이 HTML을 열어 주세요. 이 브라우저는 로컬 폴더 저장을 지원하지 않습니다.');
      const options={id:'devtrack-root',mode:'readwrite'};
      if(rootHandle || fileHandle)options.startIn=rootHandle||fileHandle;
      const selected=await window.showDirectoryPicker(options);
      try{await selected.getFileHandle('index.html');}
      catch(error){if(error.name==='NotFoundError')throw new Error('index.html이 있는 DevTrack 폴더를 선택하세요.');throw error;}
      let drafts;
      try{drafts=await selected.getFileHandle('drafts.json');}
      catch(error){
        if(error.name!=='NotFoundError')throw error;
        if(fileHandle && !change){try{await fileHandle.getFile();throw new Error('현재 drafts.json이 있는 DevTrack 폴더를 선택하세요.');}catch(check){if(check.name!=='NotFoundError')throw check;}}
        drafts=null;
      }
      if(fileHandle && drafts && !change && !(await fileHandle.isSameEntry(drafts))){
        try{await fileHandle.getFile();throw new Error('현재 drafts.json이 있는 DevTrack 폴더를 선택하세요.');}catch(error){if(error.name!=='NotFoundError')throw error;}
      }
      rootHandle=selected;fileHandle=drafts;$('change-file').hidden=false;
      try{await cacheHandle('put',selected,'root');await cacheHandle('put',drafts);}catch(_){}
    }
    function renderImages() {
      $('images').replaceChildren();
      for(const item of attachments){
        const card=document.createElement('div');card.className='image-card';
        const preview=document.createElement('img');preview.src=item.preview;preview.alt=item.file.name;
        const name=document.createElement('span');name.textContent=item.file.name;
        const remove=document.createElement('button');remove.type='button';remove.textContent='첨부 취소';remove.disabled=saving;
        remove.onclick=()=>{if(saving)return;attachments.splice(attachments.indexOf(item),1);URL.revokeObjectURL(item.preview);renderImages();};
        card.append(preview,name,remove);$('images').append(card);
      }
    }
    function addImages(files) {
      if(saving)return 0;
      let count=0;
      for(const file of files){
        if(!file.type.startsWith('image/')){message('이미지 파일을 선택하세요.',true);continue;}
        attachments.push({file,preview:URL.createObjectURL(file),path:null});count++;
      }
      renderImages();
      return count;
    }
    async function storeImages(items) {
      const assets=await rootHandle.getDirectoryHandle('assets',{create:true});
      const directory=await assets.getDirectoryHandle('drafts',{create:true});
      for(const item of items){
        if(!item.path){
          const suffix=item.file.name.match(/\.([a-zA-Z0-9]{1,10})$/)?.[1]?.toLowerCase() || 'png';
          item.path=`assets/drafts/${crypto.randomUUID()}.${suffix}`;
        }
        const handle=await directory.getFileHandle(item.path.split('/').pop(),{create:true});
        const writer=await handle.createWritable({mode:'exclusive'});
        try{await writer.write(item.file);await writer.close();}catch(error){try{await writer.abort();}catch(_){}throw error;}
        const original=new Uint8Array(await item.file.arrayBuffer());
        const saved=new Uint8Array(await (await handle.getFile()).arrayBuffer());
        if(original.length!==saved.length || !original.every((byte,index)=>byte===saved[index]))throw new Error('이미지 저장을 확인하지 못했습니다. 입력한 자료와 첨부는 유지됩니다.');
      }
    }
    function parseDrafts(text) {
      if(!text.trim())return [];
      let drafts;
      try{drafts=JSON.parse(text);}catch(_){throw new Error('drafts.json을 읽지 못했습니다. 기존 파일을 덮어쓰지 않았습니다.');}
      if(!Array.isArray(drafts))throw new Error('drafts.json은 배열이어야 합니다. 기존 파일을 덮어쓰지 않았습니다.');
      const ids=new Set();
      for(const item of drafts){
        if(!item || typeof item.id!=='string' || !item.id || ids.has(item.id) || !categories.has(item.category) || typeof item.title!=='string' || typeof item.content!=='string' || !item.content.trim() || !Number.isFinite(Date.parse(item.createdAt)))throw new Error('기존 자료의 형식을 확인하세요. 파일을 덮어쓰지 않았습니다.');
        ids.add(item.id);
      }
      return drafts;
    }
    async function writeDraft(entry, items, original) {
      const before=await (await fileHandle.getFile()).text();
      const drafts=parseDrafts(before);
      const index=original?drafts.findIndex(item=>item.id===original.id):-1;
      if(original && (index<0 || ['id','category','title','content','createdAt'].some(key=>drafts[index][key]!==original[key])))throw new Error('수정할 자료가 변경되었거나 없어졌습니다. 목록을 새로고침하세요.');
      if(items.length){
        await storeImages(items);
        const links=items.map(item=>`![${item.file.name.replace(/[\r\n]/g,' ').replace(/[\\\[\]]/g,'\\$&')}](${item.path})`).join('\n\n');
        entry.content+=(entry.content?'\n\n':'')+links;
      }
      if(original)drafts[index]={...drafts[index],...entry};else drafts.push(entry);
      const latest=await (await fileHandle.getFile()).text();
      if(latest!==before)throw new Error('다른 작업이 파일을 변경했습니다. 다시 저장해 주세요.');
      const writer=await fileHandle.createWritable({mode:'exclusive'});
      const output=JSON.stringify(drafts,null,2)+'\n';
      try{await writer.write(output);await writer.close();}catch(error){try{await writer.abort();}catch(_){}throw error;}
      const saved=await (await fileHandle.getFile()).text();
      if(saved!==output)throw new Error('파일이 변경되어 저장을 확인하지 못했습니다. drafts.json을 확인하세요.');
      return drafts.length;
    }
    async function save(event) {
      event.preventDefault();if(saving)return;
      if(loadingDrafts){message('목록을 불러온 뒤 다시 저장해 주세요.',true);return;}
      if(!categories.has($('category').value)){message('카테고리를 선택하세요.',true);return;}
      if(!$('content').value.trim() && !attachments.length){message('내용을 입력하거나 이미지를 첨부하세요.',true);return;}
      const formContent=$('content').value, items=[...attachments], original=editingDraft;
      const entry={id:original?.id??crypto.randomUUID(),category:$('category').value,title:$('title').value,content:$('content').value,createdAt:original?.createdAt??new Date().toISOString()};
      let returnToList=false;
      saving=true;$('save').disabled=true;$('cancel-edit').disabled=true;$('change-file').disabled=true;$('attach').disabled=true;renderImages();
      try {
        if(!rootHandle)await chooseRoot();
        if(await rootHandle.queryPermission({mode:'readwrite'})!=='granted' && await rootHandle.requestPermission({mode:'readwrite'})!=='granted')throw new Error('자료 저장을 위해 폴더 접근을 허용해 주세요.');
        if(!fileHandle){if(original)throw new Error('수정할 자료가 없어졌습니다. 목록을 새로고침하세요.');fileHandle=await rootHandle.getFileHandle('drafts.json',{create:true});}
        if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted' && await fileHandle.requestPermission({mode:'readwrite'})!=='granted')throw new Error('자료 저장을 위해 파일 접근을 허용해 주세요.');
        try{await fileHandle.getFile();}catch(error){if(error.name!=='NotFoundError')throw error;if(original)throw new Error('수정할 자료가 없어졌습니다. 목록을 새로고침하세요.');fileHandle=await rootHandle.getFileHandle('drafts.json',{create:true});}
        const count=navigator.locks?await navigator.locks.request('devtrack-drafts-append',()=>writeDraft(entry,items,original)):await writeDraft(entry,items,original);
        for(const item of items){attachments.splice(attachments.indexOf(item),1);URL.revokeObjectURL(item.preview);}
        if($('category').value===entry.category && $('title').value===entry.title && $('content').value===formContent){returnToList=!!original;resetEditor();}
        else if(original)editingDraft={...original,...entry};
        message(`자료 ${count}개 보관됨 · drafts.json`);$('title').focus();
      } catch(error) {
        if(error.name==='AbortError')message('저장을 취소했습니다. 입력한 내용은 유지됩니다.');
        else message(error.message||'저장하지 못했습니다. 입력한 내용은 유지됩니다.',true);
      } finally { saving=false;$('save').disabled=false;$('cancel-edit').disabled=false;$('change-file').disabled=loadingDrafts||!!editingDraft;$('attach').disabled=false;renderImages();if(returnToList)showView('saved');else if(!$('saved-panel').hidden)loadSavedDrafts(); }
    }
    $('draft-form').addEventListener('submit',save);
    $('copy-prompt').onclick=async()=>{
      const prompt=$('ai-prompt');$('copy-prompt').disabled=true;
      try{
        if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(prompt.value);
        $('copy-status').textContent='복사했습니다. Codex에 붙여넣으세요.';
      }catch(_){
        prompt.focus();prompt.select();prompt.setSelectionRange(0,prompt.value.length);
        let copied=false;try{copied=document.execCommand('copy');}catch(_){}
        $('copy-status').textContent=copied?'복사했습니다. Codex에 붙여넣으세요.':'문구를 선택했습니다. Ctrl+C로 복사하세요.';
      }finally{$('copy-prompt').disabled=false;}
    };
    $('attach').onclick=()=>{if(!saving)$('image-input').click();};
    $('image-input').onchange=()=>{
      addImages($('image-input').files);
      $('image-input').value='';
    };
    $('draft-form').addEventListener('paste',event=>{
      const files=[...(event.clipboardData?.files||[])].filter(file=>file.type.startsWith('image/'));
      if(!files.length)return;
      if(!event.clipboardData.getData('text/plain'))event.preventDefault();
      if(saving){message('저장이 끝난 뒤 이미지를 붙여넣으세요.',true);return;}
      const count=addImages(files);
      message(`이미지 ${count}개 첨부됨 · 자료 저장을 누르면 함께 저장됩니다.`);
    });
    $('change-file').onclick=async()=>{if(saving||loadingDrafts||editingDraft)return;try{await chooseRoot(true);message(`${rootHandle.name} 연결됨 · drafts.json에 계속 저장됩니다.`);if(!$('saved-panel').hidden)loadSavedDrafts();}catch(error){if(error.name!=='AbortError')message(error.message,true,$('saved-panel').hidden?'status':'saved-status');}};
    Promise.all([cacheHandle('get'),cacheHandle('get',null,'root')]).then(async([handle,root])=>{
      if(!fileHandle && !saving && !loadingDrafts){
        let restored=null;
        if(root){try{restored=await root.getFileHandle('drafts.json');}catch(_){} }
        else if(handle && handle.name==='drafts.json')restored=handle;
        if(fileHandle || saving || loadingDrafts)return;
        rootHandle=root||null;fileHandle=restored;
        if(rootHandle || fileHandle){$('change-file').hidden=false;message('저장 위치 연결됨 · 자료 저장 시 접근 권한을 확인합니다.');}
      }
    }).catch(()=>{});
  })();
  </script>
</body>
</html>
